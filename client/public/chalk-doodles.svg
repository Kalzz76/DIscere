<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <!-- Filter blur untuk debu dan bekas hapusan kapur autentik -->
    <filter id="dust-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="dust-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
    <filter id="chalk-rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- LAPISAN 1: Bekas Hapusan Papan Tulis (Chalkboard Eraser Smudges & White Dust Clouds) -->
  <g fill="#f4ecd8" opacity="0.22" filter="url(#dust-heavy)">
    <!-- Sapuan penghapus mendatar dan miring khas papan kelas -->
    <path d="M 60 120 Q 240 80 420 130 T 740 100 C 760 160 680 200 480 180 T 100 210 Z" />
    <path d="M 40 420 Q 300 360 520 440 T 780 400 C 750 490 560 480 340 500 T 50 470 Z" />
    <path d="M 120 660 Q 380 620 580 680 T 760 640 C 720 730 460 740 240 730 T 90 710 Z" />
    <!-- Gumpalan debu kapur -->
    <ellipse cx="200" cy="260" rx="140" ry="60" />
    <ellipse cx="620" cy="280" rx="160" ry="70" />
    <ellipse cx="400" cy="560" rx="180" ry="75" />
    <ellipse cx="680" cy="720" rx="120" ry="50" />
    <ellipse cx="140" cy="740" rx="110" ry="45" />
  </g>

  <!-- LAPISAN 2: Bekas coretan kapur yang terhapus samar (Faded chalkboard traces) -->
  <g stroke="#f4ecd8" stroke-linecap="round" opacity="0.18" filter="url(#dust-medium)">
    <path d="M 30 80 C 120 50 220 120 310 90" stroke-width="14" />
    <path d="M 450 310 C 560 270 650 340 750 300" stroke-width="18" />
    <path d="M 80 520 C 180 490 320 550 440 510" stroke-width="16" />
    <path d="M 380 720 Q 520 670 680 740" stroke-width="20" />
  </g>

  <!-- LAPISAN 3: Coretan Kapur Kelas, Rumus Matematika & Doodle Edukatif -->
  <g stroke="#f4ecd8" stroke-linecap="round" stroke-linejoin="round" opacity="0.38">
    <!-- Rumus: E = mc² -->
    <g transform="translate(60, 90)">
      <text x="0" y="0" font-family="'Caveat Brush', 'Comic Sans MS', cursive" font-size="34" font-weight="bold" fill="#f4ecd8" stroke="none">E = mc²</text>
      <path d="M -5 12 Q 55 6 120 12" stroke-width="2.5" />
    </g>

    <!-- Kubus Geometri 3D -->
    <g transform="translate(620, 60)" stroke-width="2.5">
      <rect x="0" y="18" width="65" height="65" rx="3" fill="none" />
      <rect x="22" y="0" width="65" height="65" rx="3" stroke-dasharray="4 3" fill="none" />
      <line x1="0" y1="18" x2="22" y2="0" />
      <line x1="65" y1="18" x2="87" y2="0" />
      <line x1="65" y1="83" x2="87" y2="65" />
      <line x1="0" y1="83" x2="22" y2="65" stroke-dasharray="4 3" />
    </g>

    <!-- Rumus Teorema Pythagoras: a² + b² = c² -->
    <g transform="translate(320, 110)">
      <text x="0" y="0" font-family="'Caveat Brush', cursive" font-size="30" font-weight="bold" fill="#f4ecd8" stroke="none">a² + b² = c²</text>
    </g>

    <!-- Simbol Atom & Sains -->
    <g transform="translate(160, 240)">
      <circle cx="0" cy="0" r="7" fill="#f4ecd8" stroke="none" />
      <ellipse cx="0" cy="0" rx="46" ry="16" stroke-width="2.2" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="46" ry="16" stroke-width="2.2" transform="rotate(-30)" />
      <ellipse cx="0" cy="0" rx="46" ry="16" stroke-width="2.2" transform="rotate(90)" />
    </g>

    <!-- Lampu Ide (Lightbulb) -->
    <g transform="translate(480, 210)" stroke-width="2.4">
      <path d="M 0 -18 C -15 -18, -20 2, -12 16 C -8 22, -5 26, -5 32 L 5 32 C 5 26, 8 22, 12 16 C 20 2, 15 -18, 0 -18 Z" fill="none" />
      <path d="M -5 36 L 5 36 M -3 40 L 3 40" />
      <!-- Pancaran cahaya kapur -->
      <line x1="0" y1="-26" x2="0" y2="-34" />
      <line x1="-22" y1="-20" x2="-28" y2="-27" />
      <line x1="22" y1="-20" x2="28" y2="-27" />
      <line x1="-28" y1="0" x2="-36" y2="0" />
      <line x1="28" y1="0" x2="36" y2="0" />
    </g>

    <!-- Rumus Akar & Pecahan -->
    <g transform="translate(630, 260)">
      <text x="0" y="0" font-family="'Caveat Brush', cursive" font-size="28" font-weight="bold" fill="#f4ecd8" stroke="none">√144 = 12</text>
    </g>
    <g transform="translate(60, 360)">
      <text x="0" y="0" font-family="'Caveat Brush', cursive" font-size="28" font-weight="bold" fill="#f4ecd8" stroke="none">½ + ¼ = ¾</text>
      <path d="M 0 12 Q 60 6 130 14" stroke-width="2.2" />
    </g>

    <!-- Segitiga Siku-Siku Pythagoras -->
    <g transform="translate(450, 420)" stroke-width="2.4">
      <path d="M 0 70 L 90 70 L 0 0 Z" fill="none" />
      <path d="M 0 54 L 16 54 L 16 70" stroke-width="2" />
      <text x="40" y="90" font-family="'Caveat Brush', cursive" font-size="20" fill="#f4ecd8" stroke="none">a</text>
      <text x="-18" y="42" font-family="'Caveat Brush', cursive" font-size="20" fill="#f4ecd8" stroke="none">b</text>
      <text x="54" y="32" font-family="'Caveat Brush', cursive" font-size="20" fill="#f4ecd8" stroke="none">c</text>
    </g>

    <!-- Planet Saturnus dengan Cincin -->
    <g transform="translate(260, 420)">
      <circle cx="0" cy="0" r="24" stroke-width="2.4" fill="none" />
      <ellipse cx="0" cy="0" rx="45" ry="11" stroke-width="2.2" transform="rotate(-22)" />
    </g>

    <!-- Bintang-bintang Kapur (Chalk Stars) -->
    <g stroke-width="2.2" fill="none">
      <path d="M 360 280 L 364 294 L 378 294 L 367 303 L 371 317 L 360 308 L 349 317 L 353 303 L 342 294 L 356 294 Z" />
      <path d="M 680 460 L 683 470 L 693 470 L 685 477 L 688 487 L 680 480 L 672 487 L 675 477 L 667 470 L 677 470 Z" />
      <path d="M 120 580 L 123 589 L 132 589 L 125 595 L 127 604 L 120 598 L 113 604 L 115 595 L 108 589 L 117 589 Z" />
      <path d="M 580 620 L 583 628 L 591 628 L 585 634 L 587 642 L 580 637 L 573 642 L 575 634 L 569 628 L 577 628 Z" />
    </g>

    <!-- Buku Terbuka (Open Book) -->
    <g transform="translate(240, 600)" stroke-width="2.5">
      <path d="M 0 0 C 18 -8, 38 -8, 56 0 L 56 42 C 38 34, 18 34, 0 42 Z" fill="none" />
      <path d="M 0 0 C -18 -8, -38 -8, -56 0 L -56 42 C -38 34, -18 34, 0 42 Z" fill="none" />
      <line x1="0" y1="0" x2="0" y2="42" stroke-width="2.5" />
      <!-- Garis halaman -->
      <line x1="10" y1="12" x2="44" y2="8" stroke-width="1.8" />
      <line x1="10" y1="22" x2="44" y2="18" stroke-width="1.8" />
      <line x1="-10" y1="12" x2="-44" y2="8" stroke-width="1.8" />
      <line x1="-10" y1="22" x2="-44" y2="18" stroke-width="1.8" />
    </g>

    <!-- Jangka Matematika (Compass) -->
    <g transform="translate(100, 190)" stroke-width="2.2">
      <circle cx="0" cy="0" r="4" fill="#f4ecd8" stroke="none" />
      <line x1="0" y1="4" x2="-16" y2="44" />
      <line x1="0" y1="4" x2="16" y2="44" />
      <path d="M -10 24 Q 0 19 10 24" stroke-width="1.8" />
    </g>

    <!-- Rumus Pi & Persamaan Linear -->
    <g transform="translate(430, 600)">
      <text x="0" y="0" font-family="'Caveat Brush', cursive" font-size="32" font-weight="bold" fill="#f4ecd8" stroke="none">π ≈ 3.14159</text>
    </g>
    <g transform="translate(600, 680)">
      <text x="0" y="0" font-family="'Caveat Brush', cursive" font-size="28" font-weight="bold" fill="#f4ecd8" stroke="none">f(x) = 2x + 1</text>
      <path d="M -8 10 Q 50 4 130 12" stroke-width="2.2" />
    </g>

    <!-- Tanda Centang & Jempol Sukses -->
    <g transform="translate(60, 710)">
      <text x="0" y="0" font-family="'Caveat Brush', cursive" font-size="28" font-weight="bold" fill="#f4ecd8" stroke="none">100 / 100 ★</text>
      <path d="M 140 -8 L 152 4 L 175 -20" stroke-width="3" stroke="#f2c230" fill="none" opacity="0.6" />
    </g>

    <!-- Garis Gelombang Kapur & Arah Panah -->
    <path d="M 330 360 Q 370 340 400 370" stroke-width="2.5" />
    <path d="M 395 358 L 402 372 L 388 375" stroke-width="2.2" />
  </g>
</svg>