name: Auto Sync Upstream

on:
  schedule:
    - cron: '*/30 * * * *' # Otomatis sinkronisasi setiap 30 menit
  workflow_dispatch: # Tombol manual "Run workflow" di GitHub tab Actions

jobs:
  sync:
    name: Sync with refkyaja/DIscere
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge Upstream Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/refkyaja/DIscere.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --ff-only || git merge upstream/main -m "chore: sync with upstream"
          git push origin main

