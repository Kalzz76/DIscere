<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discere - Papan Pembelajaran</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--p:rgba(23,29,48,.94);--p2:#293350;--tx:#eef1fa;--mu:#8e98b4;--pu:#9b17f5;--bl:#1a5cff;--gr:#34d399;--ln:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--tx);user-select:none;-webkit-user-select:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #8ab4ff;outline-offset:2px}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.pn{position:fixed;background:var(--p);backdrop-filter:blur(14px);border:1px solid var(--ln);box-shadow:0 10px 30px rgba(10,15,35,.28);z-index:5}
.ib{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--mu);transition:.15s}
.ib:hover{background:var(--p2);color:var(--tx)}
.ib[disabled]{opacity:.3;pointer-events:none}
.ib.on{background:var(--p2);color:#fff}

#tl{top:20px;left:20px;height:56px;border-radius:18px;display:flex;align-items:center;gap:8px;padding:0 12px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.6px;margin:0 4px}
#ttl{background:none;border:0;color:var(--tx);font:700 16px inherit;font-family:inherit;width:190px;padding:6px 8px;border-radius:8px;text-overflow:ellipsis}
#ttl:hover,#ttl:focus{background:var(--p2);outline:0}
#sv{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;background:var(--p2);padding:7px 11px;border-radius:10px;color:var(--gr);min-width:86px}
#sv svg{width:15px;height:15px}
#sv.busy{color:var(--mu)}

#tools{top:92px;left:20px;bottom:20px;width:86px;border-radius:22px;padding:10px 0;overflow-y:auto;scrollbar-width:none;max-height:calc(12 * 70px + 44px)}
#tools::-webkit-scrollbar{display:none}
.t{display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;margin:0 auto 4px;padding:9px 0 8px;border-radius:15px;font-size:12px;font-weight:600;color:#b9c1d9;transition:.15s}
.t svg{width:23px;height:23px}
.t:hover{background:var(--p2);color:#fff}
.t.on{background:var(--pu);color:#fff;box-shadow:0 6px 16px rgba(155,23,245,.4)}

#ob{top:92px;left:calc(50% + 43px);transform:translateX(-50%);min-height:54px;max-width:calc(100% - 260px);overflow-x:auto;scrollbar-width:none;border-radius:27px;display:flex;align-items:center;gap:12px;padding:0 20px}
#ob .lb{font-weight:800;font-size:13px;letter-spacing:.08em;margin-right:6px;padding-right:12px;border-right:1px solid var(--ln)}
#ob .hint{font-size:13px;color:var(--mu);font-weight:500}
.chip{padding:6px 11px;border-radius:14px;font-weight:700;font-size:13px;color:#c5cce0;white-space:nowrap}
.chip:hover{background:var(--p2)}
.chip.on{background:var(--pu);color:#fff}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.25) inset;margin:0 2px}
.sw.on{border-color:#fff;transform:scale(1.15)}

#tr{top:20px;right:20px;height:56px;border-radius:18px;display:flex;align-items:center;gap:4px;padding:0 8px 0 10px}
.col{display:flex;align-items:center;gap:6px;color:#5b9bff;font-weight:700;padding:0 10px;height:34px;border-left:1px solid var(--ln);border-right:1px solid var(--ln);margin:0 4px}
.col span{color:var(--tx)}
.av{width:36px;height:36px;border-radius:50%;background:#047857;display:grid;place-items:center;font-weight:800;color:#fff;margin:0 2px 0 4px}
#share{display:flex;align-items:center;gap:7px;background:var(--bl);color:#fff;font-weight:700;padding:0 18px;height:38px;border-radius:12px;margin-left:6px;transition:.15s}
#share:hover{filter:brightness(1.12)}

#pr{bottom:24px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 260px));height:66px;border-radius:33px;display:flex;align-items:center;gap:10px;padding:0 16px 0 14px}
#pr input{flex:1;min-width:0;background:none;border:0;outline:0;font:500 17px inherit;font-family:inherit;color:var(--tx);user-select:text}
#pr input::placeholder{color:#7d87a3}
#mic.rec{color:#fff;background:#e11d48;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.6}}

#zm{bottom:24px;right:20px;height:56px;border-radius:18px;display:flex;align-items:center;gap:2px;padding:0 8px}
#pct{font-weight:700;font-size:14px;min-width:52px;text-align:center}

#menu{position:fixed;z-index:20;background:#1b2238;border:1px solid var(--ln);border-radius:14px;padding:6px;min-width:190px;box-shadow:0 14px 36px rgba(5,10,30,.45);display:none}
#menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:9px;font-size:14px;font-weight:600}
#menu button:hover{background:var(--p2)}
#menu hr{border:0;border-top:1px solid var(--ln);margin:5px 0}
#toast{position:fixed;left:50%;top:92px;transform:translate(-50%,-10px);background:#fff;color:#111827;font-weight:600;font-size:14px;padding:10px 18px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.25s;z-index:30}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ed{position:fixed;display:none;z-index:15;border:2px dashed var(--pu);background:rgba(255,255,255,.92);outline:0;resize:none;font-family:inherit;color:#111827;padding:4px 8px;line-height:1.3;user-select:text;border-radius:6px}
#ex{display:none;position:fixed;top:20px;right:20px;z-index:6;background:var(--p);padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px}
body.pres .pn{display:none}
body.pres #ex{display:block}
@media(max-width:900px){#ttl{width:90px}#pr{width:calc(100% - 140px);left:calc(50% + 40px)}#ob{top:92px;left:50%;max-width:calc(100% - 140px);overflow-x:auto;transform:translateX(-50%)}.col,#share span{display:none}}

.dv{border:0;border-top:1px solid var(--ln);margin:6px 14px 8px}
.bl{color:var(--mu);font-weight:600;white-space:nowrap}.bl b{color:var(--tx)}
.rg{accent-color:var(--pu);width:110px}
.cs{width:30px;height:30px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1px #0005;flex:none}
.sel{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px 8px;font:inherit;font-size:13px;font-weight:600}
#fly{display:none;left:116px;top:92px;border-radius:20px;width:300px;max-height:calc(100% - 120px);overflow:auto;padding:14px;z-index:7}
#fly h4{font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.fb{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;color:#c5cce0}
.fb.on{background:var(--pu);color:#fff}.fb:hover:not(.on){background:var(--p2)}
.tabs{display:flex;gap:4px;margin-bottom:12px}.tabs .chip.on{background:var(--p2);color:#fff}
.sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sg button{aspect-ratio:1;border-radius:12px;background:var(--p2);display:grid;place-items:center}
.sg button:hover,.sg button.on{outline:2px solid #5b9bff}
.sg svg{width:26px;height:26px;fill:currentColor;stroke:none}
.sl{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.04em;margin:14px 0 8px}
.tb1{width:100%;display:flex;align-items:center;gap:10px;background:var(--bl);padding:13px 16px;border-radius:12px;font-weight:700}
.ts{display:block;width:100%;text-align:left;background:var(--p2);padding:13px 16px;border-radius:12px;margin-bottom:8px}
.tg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.tg button{aspect-ratio:1;border:1px solid #3a4562;border-radius:6px}.tg button.hl{background:#5b9bff;border-color:#5b9bff}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qg button{padding:10px 4px;border-radius:12px;background:var(--p2);font-size:12px;font-weight:600;color:#c5cce0}.qg button:hover{outline:2px solid #5b9bff}
.mg{display:grid;gap:2px;width:44px;height:36px;margin:0 auto 6px}.mg u{background:#5b9bff;border-radius:2px}
#cp{display:none;width:256px;padding:12px;border-radius:16px;z-index:12}
#cpS{width:232px;height:150px;border-radius:10px;display:block;cursor:crosshair;touch-action:none}
.cr{display:flex;align-items:center;gap:10px;margin:10px 0}
#cpP{width:34px;height:34px;border-radius:50%;border:2px solid #fff;flex:none}
#cpH{flex:1;-webkit-appearance:none;height:12px;border-radius:6px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#cpH::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #333}
.cn{display:flex;gap:8px}.cn label{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.cn input{width:100%;padding:6px 2px;border-radius:8px;border:1px solid var(--ln);background:var(--p2);color:var(--tx);text-align:center;font:inherit;margin-bottom:3px;user-select:text}
.qs{display:flex;gap:6px;margin-top:10px}
#shr{display:none;top:84px;right:20px;width:360px;border-radius:20px;padding:20px;background:#1c1d24;z-index:9}
#shr b{font-size:18px}#shr .sl{font-size:14px;color:#e8ecf5;letter-spacing:0;margin:16px 0 8px}
.si{display:flex;align-items:center;gap:8px;background:#12131a;border:1px solid var(--ln);border-radius:12px;padding:0 12px;height:44px;margin-top:14px;color:var(--mu)}
.si input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;user-select:text}
.av2{display:flex;margin-top:12px;gap:6px}.av2 span,.av2 button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;border:2px solid #fff3}
.av2 button{background:#2a2c38;font-size:18px}
.sr{display:flex;align-items:center;gap:12px}.gi{width:44px;height:44px;border-radius:50%;background:#2a2c38;display:grid;place-items:center;flex:none}
.sx{flex:1;display:flex;flex-direction:column;gap:2px}.sx small{color:var(--mu);font-size:12px}
.shs{background:none;border:0;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}.shs option{background:#1c1d24}
.shb{width:100%;margin-top:18px;height:44px;border-radius:12px;background:linear-gradient(#8b3dff,#6d28d9);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.shl{display:block;width:100%;text-align:center;margin-top:16px;font-weight:600;font-size:14px}
#ai{display:none;position:fixed;z-index:25;width:min(440px,calc(100% - 24px));background:#1b2338;border:2px solid #e57200;border-radius:18px;padding:16px 18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ah{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #4a2b0a;margin-bottom:12px}
.at{display:flex;align-items:center;gap:8px;color:#fbbf24;font-weight:800;font-size:18px;flex:1}.at svg{stroke:#fbbf24}
.bd{background:#4a2406;color:#fdba74;border-radius:10px;padding:4px 10px;font-size:12px;font-weight:700}
#ai input{width:100%;background:#050711;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;color:var(--tx);font:inherit;outline:0;margin-top:8px;user-select:text}
.al{color:#9aa6c4;font-weight:700;font-size:14px}
#aia{white-space:pre-wrap;user-select:text;font-size:14px;line-height:1.55;max-height:260px;overflow:auto;margin-top:12px;color:#dbe3f5}
.ab{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:14px}.ab #aic{color:#9aa6c4;font-weight:700}
#aig{display:flex;align-items:center;gap:8px;background:#e57200;color:#fff;font-weight:700;padding:11px 18px;border-radius:14px}#aig[disabled]{opacity:.6}
#aig svg{stroke:#fff}

#cw{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);width:min(700px,calc(100% - 260px));z-index:6;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#cw>*{pointer-events:auto}
#chat{display:none;background:var(--p);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:22px;box-shadow:0 10px 30px rgba(10,15,35,.28);padding:12px 14px;max-height:min(52vh,480px);flex-direction:column;gap:10px}
.ch{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}.ch span{flex:1;display:flex;align-items:center;gap:8px}
#ck{background:#0d1222;border:1px solid var(--ln);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit;font-size:13px;outline:0;user-select:text}
#cm{overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.m{max-width:90%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.55;user-select:text;-webkit-user-select:text;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:var(--pu);color:#fff;border-bottom-right-radius:5px}
.m.a{align-self:flex-start;background:var(--p2);border-bottom-left-radius:5px}
.m small{display:block;opacity:.8;margin-top:4px;font-size:12px}
.m pre{background:#0d1222;padding:10px;border-radius:10px;overflow:auto;white-space:pre;margin:6px 0}.m code{background:#0d1222;padding:1px 5px;border-radius:5px}
.m .tl{display:block;margin-top:8px;font-size:12px;font-weight:700;color:#c5cce0;background:#0004;padding:5px 10px;border-radius:9px}.m .tl:hover{background:#0007}
#att{display:flex;gap:8px;flex-wrap:wrap}
.ac{display:flex;align-items:center;gap:8px;background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:6px 6px 6px 8px;font-size:13px;font-weight:600;max-width:230px}
.ac img{width:30px;height:30px;border-radius:6px;object-fit:cover}.ac span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#snd[disabled]{opacity:.4}
@media(max-width:900px){#cw{width:calc(100% - 140px);left:calc(50% + 40px)}}

#gm{width:42px;height:38px;background:#eef1fa;color:#1e2538;border-radius:12px;margin:0 6px 0 2px}#gm:hover{background:#fff;color:#111}#gm.on{box-shadow:0 0 0 2px var(--pu)}
#av{display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;height:42px;border-radius:12px;color:var(--tx);font-size:17px}#av:hover{background:var(--p2)}
#avs{display:flex;padding-left:10px}
#avs span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;border:2px solid #171d30;margin-left:-10px;flex:none}
#avs .g{background:#e3f2c9}#avs .g svg{width:22px;height:22px;stroke:none;fill:#8c9a85}#avs .me{background:#2f6f23}
#qz{top:92px;right:20px;bottom:20px;width:min(380px,calc(100% - 40px));border-radius:22px;display:flex;flex-direction:column;z-index:8;visibility:hidden;transform:translateX(calc(100% + 30px));transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
#qz.open{visibility:visible;transform:none;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.qth{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;font-weight:800;font-size:17px}.qth span{flex:1}
#qzb{flex:1;overflow:auto;padding:4px 18px 18px;user-select:text}
.qs0{color:var(--mu);font-size:14px;margin-bottom:14px;line-height:1.5}
.qc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--p2);border-radius:16px;padding:14px;margin-bottom:10px;transition:.15s}
.qc:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.qc i{font-style:normal;font-size:26px;width:50px;height:50px;border-radius:14px;background:#0003;display:grid;place-items:center;flex:none}
.qc b{display:block;font-size:15px}.qc small{color:var(--mu);font-size:12px}
.qc em{margin-left:auto;font-style:normal;background:var(--pu);color:#fff;font-weight:700;font-size:13px;padding:7px 12px;border-radius:10px}
.qh{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:12px}.qh b{flex:1}
.qp{background:#3b2a05;color:#fbbf24;padding:5px 10px;border-radius:10px;font-size:13px;font-weight:800}
.qbar,.qtm{height:6px;border-radius:3px;background:#0004;overflow:hidden;margin:6px 0 10px}.qbar i,.qtm i{display:block;height:100%;background:var(--pu);border-radius:3px;transition:width .3s}.qtm i{background:#22c55e;transition:none}
.qq{font-size:19px;line-height:1.4;margin:14px 0 16px}
.qo button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--p2);border:2px solid transparent;border-radius:14px;padding:13px 14px;margin-bottom:9px;font-weight:600;font-size:15px}
.qo button:not(:disabled):hover{border-color:#5b9bff}.qo button:disabled{cursor:default}
.qo kbd{width:28px;height:28px;border-radius:8px;background:#0004;display:grid;place-items:center;font:700 13px inherit;font-family:inherit;flex:none}
.qo .ok{background:#14532d;border-color:#22c55e}.qo .no{background:#5b1420;border-color:#ef4444}
.qf{display:flex;align-items:center;gap:10px;margin-top:6px;font-weight:700}.qf span{flex:1}
.qa{background:var(--pu);color:#fff;font-weight:700;padding:10px 16px;border-radius:12px}.qa.g{background:var(--p2);color:#c5cce0}
.qr{text-align:center;padding:10px 0}.qr .em{font-size:56px}.qr h3{font-size:22px;margin:8px 0 4px}.qr p{color:var(--mu);margin-bottom:18px}
.qr .qa{display:block;width:100%;margin-bottom:8px;padding:12px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="pn" id="tl">
  <button class="ib" id="mn" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <span class="logo">discere</span>
  <button class="ib" id="emo" title="Ganti ikon" style="font-size:19px;color:inherit">😊</button>
  <input id="ttl" value="Papan Pembelajaran Baru" aria-label="Judul papan" maxlength="60">
  <button class="ib" id="exp" title="Ekspor PNG"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 14v5h14v-5"/></svg></button>
  <span id="sv"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg><b>Saved</b></span>
</header>

<nav class="pn" id="tools"></nav>
<div class="pn" id="ob"></div>

<div class="pn" id="tr">
  <button class="ib" id="un" title="Urungkan (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="ib" id="re" title="Ulangi (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <button class="ib" id="gm" title="Kuis interaktif" aria-label="Kuis interaktif"><svg viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="11" rx="5"/><path d="M7 10v4M5 12h4M15.5 11h.01M18 13h.01"/></svg></button>
  <button id="av" title="Kolaborator dan akun" aria-label="Akun"><span id="avs"></span><b id="cn">1</b><svg viewBox="0 0 24 24" style="width:16px;height:16px;color:var(--mu)"><path d="M6 9l6 6 6-6"/></svg></button>
  <button class="ib" id="pl" title="Mode presentasi"><svg viewBox="0 0 24 24" style="fill:currentColor"><path d="M7 5l12 7-12 7z"/></svg></button>
  <button id="share"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span>Share</span></button>
</div>

<div id="cw"><div id="chat"><div class="ch"><span><svg viewBox="0 0 24 24" style="color:#fbbf24"><path d="M9 6l1.8 4.2L15 12l-4.2 1.8L9 18l-1.8-4.2L3 12l4.2-1.8z"/><path d="M18 3v4M16 5h4"/></svg>Asisten AI</span><button class="ib" id="cc" title="Mulai obrolan baru" aria-label="Obrolan baru"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button><button class="ib" id="cx" title="Sembunyikan" aria-label="Sembunyikan">✕</button></div><input id="ck" type="password" placeholder="Kunci API Anthropic (disimpan di browser ini)" hidden><div id="cm"></div></div><div id="att"></div></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d'),mc=document.createElement('canvas').getContext('2d');
const COL=['#111827','#ef4444','#f59e0b','#22c55e','#3b82f6','#9b17f5','#ffffff'];
const SZ=[2,4,8,14];
const TOOLS=[
 ['select','Pilih','V','<path d="M4 4l7 17 2.5-7.5L21 11z"/>'],
 ['hand','Tangan','H','<path d="M8 13V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7M17 9a1.5 1.5 0 0 1 3 0v5a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.5-2.7L4 14.5a1.5 1.5 0 0 1 2.4-1.8L8 14"/>'],
 ['laser','Laser','L','<circle cx="12" cy="12" r="2.4" style="stroke:#f87171"/><path d="M12 3v3.5M12 17.5V21M3 12h3.5M17.5 12H21M5.6 5.6l2.4 2.4M16 16l2.4 2.4M18.4 5.6L16 8M8 16l-2.4 2.4" style="stroke:#f87171"/>'],
 ['pen','Pena','P','<path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/>'],
 ['eraser','Hapus','E','<path d="M20 20H8l-4.3-4.3a1.5 1.5 0 0 1 0-2.1L13.6 3.7a1.5 1.5 0 0 1 2.1 0l4.6 4.6a1.5 1.5 0 0 1 0 2.1L12 19"/><path d="M7 11l6 6"/>'],
 ['shape','Bentuk','S','<path d="M12 3l3.5 6h-7z"/><rect x="3.5" y="14" width="6" height="6" rx="1"/><circle cx="17" cy="17" r="3.2"/>'],
 ['text','Teks','T','<path d="M5 5V4h14v1M12 4v16M9 20h6"/>'],
 ['table','Tabel','B','<rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 9h17M10 9v11.5"/>'],
 ['fill','Isi','F','<path d="M5 11l7-7 7 7-7 7z"/><path d="M19 15c1 1.5 1.5 2.5 1.5 3.2a1.5 1.5 0 0 1-3 0c0-.7.5-1.7 1.5-3.2z"/>'],

 ['pick','Pipet','I','<path d="M15 4l5 5-3 1-7 7-4 1 1-4 7-7zM4 20l3-3"/>'],
 ['ai','Tanya AI','A','<path d="M9 6l1.8 4.2L15 12l-4.2 1.8L9 18l-1.8-4.2L3 12l4.2-1.8z" style="stroke:#fbbf24"/><path d="M18 3v4M16 5h4M18 15v3M16.5 16.5h3" style="stroke:#fbbf24"/>'],
 ['upload','Upload','U','<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>']
];
const SHAPES=[['rect','Kotak'],['ellipse','Elips'],['tri','Segitiga'],['line','Garis'],['arrow','Panah']];
const LCOL=['#ef4444','#22c55e','#3b82f6'];
let S={tool:'pen',color:COL[0],size:4,er:14,style:'pen',op:1,ss:3,tab:'Dasar',shape:'rect',fs:24,tsz:3,lc:LCOL[0],grid:true};
let lasso=null,objs=[],sel=null,view={x:0,y:0,z:1},hist=[],hi=-1,nid=1,cur=null,drag=null,mouse=null,laser=[],edit=null,space=false,prevTool=null,raf=0;

/* ---------- util ---------- */
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}
const W=e=>({x:(e.clientX-view.x)/view.z,y:(e.clientY-view.y)/view.z});
function rd(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
function lines(o){return String(o.text).split('\n')}
function bounds(o){
 if(o.type==='stroke'){let a=1e9,b=1e9,c=-1e9,d=-1e9;o.pts.forEach(p=>{a=Math.min(a,p.x);b=Math.min(b,p.y);c=Math.max(c,p.x);d=Math.max(d,p.y)});const r=ew(o)/2;return{x:a-r,y:b-r,w:c-a+2*r,h:d-b+2*r}}
 if(o.type==='text'){mc.font=`${o.fw||600} ${o.fs}px "Plus Jakarta Sans",sans-serif`;const L=lines(o);return{x:o.x,y:o.y,w:Math.max(40,...L.map(l=>mc.measureText(l).width))+24,h:L.length*o.fs*1.3+16}}
 if(o.type==='table')return{x:o.x,y:o.y,w:o.cols*o.cw,h:o.rows*o.ch};
 return{x:Math.min(o.x,o.x+o.w),y:Math.min(o.y,o.y+o.h),w:Math.abs(o.w),h:Math.abs(o.h)}
}
function hit(o,p,t=6){
 if(o.type==='stroke'){const r=ew(o)/2+t;for(let i=0;i<o.pts.length;i++){const a=o.pts[i],b=o.pts[i+1]||a;if(dseg(p,a,b)<=r)return true}return false}
 const b=bounds(o);return p.x>=b.x-t&&p.x<=b.x+b.w+t&&p.y>=b.y-t&&p.y<=b.y+b.h+t
}
function dseg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let u=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;u=Math.max(0,Math.min(1,u));return Math.hypot(p.x-a.x-u*dx,p.y-a.y-u*dy)}
function ew(o){return o.size*(o.st==='marker'?2.6:o.st==='pencil'?.85:1)}
function topAt(p,t){for(let i=objs.length-1;i>=0;i--)if(hit(objs[i],p,t))return objs[i]}
function move(o,dx,dy){if(o.type==='stroke')o.pts.forEach(p=>{p.x+=dx;p.y+=dy});else{o.x+=dx;o.y+=dy}}

/* ---------- gambar ---------- */
function drawObj(c,o){c.save();c.globalAlpha=(o.op??1)*(o.st==='marker'?.75:1);drawObj0(c,o);c.restore()}
function drawObj0(c,o){
 c.lineCap=c.lineJoin='round';c.strokeStyle=o.color;c.fillStyle=o.color;c.lineWidth=ew(o);if(o.st==='marker')c.lineCap='square';
 if(o.type==='stroke'){
  if(o.pts.length===1){c.beginPath();c.arc(o.pts[0].x,o.pts[0].y,ew(o)/2,0,7);c.fill();return}
  c.beginPath();c.moveTo(o.pts[0].x,o.pts[0].y);
  for(let i=1;i<o.pts.length-1;i++){const m={x:(o.pts[i].x+o.pts[i+1].x)/2,y:(o.pts[i].y+o.pts[i+1].y)/2};c.quadraticCurveTo(o.pts[i].x,o.pts[i].y,m.x,m.y)}
  const l=o.pts[o.pts.length-1];c.lineTo(l.x,l.y);c.stroke();if(o.st==='pencil'){c.globalAlpha*=.5;c.lineWidth=ew(o)*.45;c.setLineDash([1,2.5]);c.stroke();c.setLineDash([])}
 }else if(o.type==='shape'){
  const{x,y,w,h}=o,k=o.kind,bx=Math.min(x,x+w),by=Math.min(y,y+h),bw=Math.abs(w),bh=Math.abs(h);c.beginPath();
  if(k==='line'||k==='arrow'){c.moveTo(x,y);c.lineTo(x+w,y+h)}
  else if(k==='rect')c.rect(bx,by,bw,bh);
  else if(k==='round')c.roundRect(bx,by,bw,bh,Math.min(bw,bh)*.22);
  else if(k==='ellipse')c.ellipse(bx+bw/2,by+bh/2,bw/2,bh/2,0,0,7);
  else{up(k).forEach((q,i)=>c[i?'lineTo':'moveTo'](bx+q[0]*bw,by+q[1]*bh));c.closePath()}
  if(o.fill&&k!=='line'&&k!=='arrow'){c.fillStyle=o.fill;c.fill()}
  c.stroke();
  if(k==='arrow'){const a=Math.atan2(h,w),s=12+o.size*1.5;c.beginPath();c.moveTo(x+w,y+h);c.lineTo(x+w-s*Math.cos(a-.45),y+h-s*Math.sin(a-.45));c.moveTo(x+w,y+h);c.lineTo(x+w-s*Math.cos(a+.45),y+h-s*Math.sin(a+.45));c.stroke()}
 }else if(o.type==='text'){
  const b=bounds(o);if(o.fill){c.fillStyle=o.fill;c.beginPath();c.roundRect(b.x,b.y,b.w,b.h,10);c.fill()}
  c.fillStyle=o.color;c.font=`${o.fw||600} ${o.fs}px "Plus Jakarta Sans",sans-serif`;c.textBaseline='top';
  lines(o).forEach((l,i)=>c.fillText(l,o.x+12,o.y+8+i*o.fs*1.3))
 }else if(o.type==='table'){
  const b=bounds(o);if(o.fill){c.fillStyle=o.fill;c.fillRect(b.x,b.y,b.w,b.h)}
  c.lineWidth=2;c.strokeStyle=o.color;c.beginPath();
  for(let r=0;r<=o.rows;r++){c.moveTo(o.x,o.y+r*o.ch);c.lineTo(o.x+b.w,o.y+r*o.ch)}
  for(let k=0;k<=o.cols;k++){c.moveTo(o.x+k*o.cw,o.y);c.lineTo(o.x+k*o.cw,o.y+b.h)}
  c.stroke();c.fillStyle=o.color;c.font='500 16px "Plus Jakarta Sans",sans-serif';c.textBaseline='middle';
  for(const k in o.cells){const[r,q]=k.split(',').map(Number);c.fillText(o.cells[k],o.x+q*o.cw+10,o.y+r*o.ch+o.ch/2,o.cw-20)}
 }else if(o.type==='image'){if(!o._i){o._i=new Image();o._i.onload=rd;o._i.src=o.src}if(o._i.complete)c.drawImage(o._i,o.x,o.y,o.w,o.h)}
}
function draw(){
 const d=devicePixelRatio||1;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,cv.width,cv.height);
 cx.setTransform(d*view.z,0,0,d*view.z,d*view.x,d*view.y);
 if(S.grid&&view.z>.35){const g=24,x0=Math.floor(-view.x/view.z/g)*g,y0=Math.floor(-view.y/view.z/g)*g,x1=(innerWidth-view.x)/view.z,y1=(innerHeight-view.y)/view.z;cx.fillStyle='#c9cee0';for(let x=x0;x<x1;x+=g)for(let y=y0;y<y1;y+=g)cx.fillRect(x-1,y-1,2,2)}
 objs.forEach(o=>drawObj(cx,o));if(cur)drawObj(cx,cur);
 if(lasso&&lasso.length>1){cx.save();cx.beginPath();lasso.forEach((q,i)=>cx[i?'lineTo':'moveTo'](q.x,q.y));cx.closePath();cx.fillStyle='rgba(251,191,36,.13)';cx.fill();cx.strokeStyle='#f59e0b';cx.lineWidth=3/view.z;cx.setLineDash([10/view.z,7/view.z]);cx.stroke();cx.restore()}
 const s=objs.find(o=>o.id===sel);if(s){const b=bounds(s);cx.strokeStyle='#9b17f5';cx.lineWidth=1.5/view.z;cx.setLineDash([6/view.z,4/view.z]);cx.strokeRect(b.x-6,b.y-6,b.w+12,b.h+12);cx.setLineDash([])}
 const now=performance.now();laser=laser.filter(p=>now-p.t<900);
 cx.lineCap='round';for(let i=1;i<laser.length;i++){const a=laser[i-1],b=laser[i],k=1-(now-b.t)/900;cx.strokeStyle=S.lc;cx.globalAlpha=Math.max(0,k);cx.lineWidth=(6*k+2)/view.z;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
 if(laser.length){cx.globalAlpha=1;const l=laser[laser.length-1];cx.fillStyle=S.lc;cx.beginPath();cx.arc(l.x,l.y,6/view.z,0,7);cx.fill();rd()}
 cx.globalAlpha=1;
 if(S.tool==='eraser'&&mouse){cx.setTransform(d,0,0,d,0,0);cx.strokeStyle='#6b7280';cx.lineWidth=1.5;cx.beginPath();cx.arc(mouse.x,mouse.y,S.er*view.z/2+4,0,7);cx.stroke()}
}
function resize(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;rd()}
addEventListener('resize',resize);

/* ---------- riwayat & simpan ---------- */
const snap=()=>JSON.stringify(objs.map(o=>{const c={...o};delete c._i;return c}));
function commit(){hist=hist.slice(0,hi+1);hist.push(snap());if(hist.length>60)hist.shift();hi=hist.length-1;save();ub()}
function load(j){objs=JSON.parse(j);rd()}
function undo(){if(hi>0){load(hist[--hi]);sel=null;save();ub()}}
function redo(){if(hi<hist.length-1){load(hist[++hi]);save();ub()}}
function ub(){$('un').disabled=hi<=0;$('re').disabled=hi>=hist.length-1}
let st;function save(){const s=$('sv');s.classList.add('busy');s.querySelector('b').textContent='Menyimpan…';clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('discere',JSON.stringify({t:$('ttl').value,o:JSON.parse(snap()),v:view,id:nid,g:S.grid}))}catch(e){}s.classList.remove('busy');s.querySelector('b').textContent='Saved'},500)}

/* ---------- UI bar opsi & alat ---------- */
function buildTools(){$('tools').innerHTML=TOOLS.map(t=>`<button class="t" data-t="${t[0]}" title="${t[1]} (${t[2]})"><svg viewBox="0 0 24 24">${t[3]}</svg>${t[1]}</button>`).map((x,i)=>(TOOLS[i][0]==='upload'?'<hr class="dv">':'')+x).join('')}
$('tools').onclick=e=>{const b=e.target.closest('.t');if(b)choose(b.dataset.t,b)};
function setTool(t){commitEdit();closeFly();if(t!=='ai')closeAI();S.tool=t;if(t!=='select')sel=null;document.querySelectorAll('.t').forEach(b=>b.classList.toggle('on',b.dataset.t===t));cv.style.cursor={hand:'grab',eraser:'none',select:'default',text:'text',zoom:'zoom-in',pick:'copy'}[t]||'crosshair';bar();rd()}
const chips=(a,k,v,f=x=>x)=>a.map(x=>`<button class="chip ${v===(Array.isArray(x)?x[0]:x)?'on':''}" data-k="${k}" data-v="${Array.isArray(x)?x[0]:x}">${Array.isArray(x)?x[1]:f(x)}</button>`).join('');
const sws=(k,v,a=COL)=>a.map(c=>`<button class="sw ${v===c?'on':''}" data-k="${k}" data-v="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');
function bar(){
 const t=S.tool,L=TOOLS.find(x=>x[0]===t)[1].toUpperCase();let h=`<span class="lb">${L}</span>`;
 if(t==='pen')h+=CS()+sl('size','Ukuran Kuas',1,60,S.size,'px')+sl('op','Opasitas',10,100,Math.round(S.op*100),'%')+gaya();
 else if(t==='eraser')h+=sl('er','Ukuran Penghapus',4,100,S.er,'px');
 else if(t==='shape')h+=CS()+sl('ss','Tebal Garis',1,20,S.ss,'px')+sl('op','Opasitas',10,100,Math.round(S.op*100),'%');
 else if(t==='text')h+=CS()+sl('fs','Ukuran Font',12,96,S.fs,'px');
 else if(t==='table')h+=CS();
 else if(t==='fill')h+=sws('fill',S.fill||'',COL.concat(['#fde68a','#bfdbfe']))+'<button class="chip" data-k="fill" data-v="">Tanpa isi</button>';
 else if(t==='laser')h+=sws('lc',S.lc,LCOL);
 else if(t==='select')h+=`<span class="hint">Klik untuk memilih, seret untuk memindah</span><button class="chip" data-a="dup">Duplikat</button><button class="chip" data-a="del">Hapus</button>`;
 else h+=`<span class="hint">${{hand:'Seret kanvas untuk menggeser',zoom:'Klik = perbesar, Shift+klik = perkecil',pick:'Klik objek untuk mengambil warna',ai:'Gambar bebas melingkari soal, lalu tanya AI'}[t]}</span>`;
 $('ob').innerHTML=h
}
$('ob').onclick=e=>{const b=e.target.closest('[data-k],[data-a]');if(!b)return;
 if(b.dataset.a==='dup')return dup();if(b.dataset.a==='del')return del();
 const k=b.dataset.k,v=b.dataset.v;S[k]=['size','er','fs','tsz'].includes(k)?+v:v;
 if(k==='fill'&&S.tool==='fill'){S.fillSet=true}
 bar()};
function del(){if(sel){objs=objs.filter(o=>o.id!==sel);sel=null;commit();rd()}}
function dup(){const o=objs.find(o=>o.id===sel);if(!o)return;const c=JSON.parse(JSON.stringify({...o,_i:undefined}));c.id=nid++;move(c,24,24);objs.push(c);sel=c.id;commit();rd()}

/* ---------- pointer ---------- */
cv.addEventListener('pointerdown',e=>{
 if(e.button===2)return;commitEdit();cv.setPointerCapture(e.pointerId);
 const p=W(e),t=S.tool;
 if(e.button===1||t==='hand'||space){drag={k:'pan',x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};cv.style.cursor='grabbing';return}
 if(t==='pen'){cur={type:'stroke',pts:[p],color:S.color,size:S.size,st:S.style,op:S.op}}
 else if(t==='eraser'){drag={k:'er',ch:false,last:p};eraseSeg(p,p,drag)}
 else if(t==='select'){const o=topAt(p,6/view.z);sel=o?o.id:null;if(o)drag={k:'mv',p,ch:false}}
 else if(t==='shape'){cur={type:'shape',kind:S.shape,x:p.x,y:p.y,w:0,h:0,color:S.color,size:S.ss,op:S.op,fill:null}}
 else if(t==='text'){openEd({obj:null,x:p.x,y:p.y,text:''})}
 else if(t==='table'){const n=S.tsz;objs.push({id:nid++,type:'table',x:p.x-60,y:p.y-22,rows:n,cols:n,cw:120,ch:44,cells:{},color:S.color,size:2,fill:null});commit()}
