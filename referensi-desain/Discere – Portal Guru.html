<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discere – Portal Guru</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --board:#1f4a37;--board-d:#163a2b;--hero:#2e503a;--cream:#f4ecd9;--card:#fbf6e9;--chalk:#f4ecd8;--ink:#1d3b2e;
  --yellow:#f2c230;--red:#c8362f;--red2:#d9544c;--wood:#a6783c;--wood-d:#8d6444;--mute:#6b7d6c;--line:#e0d5b8;--tg:#d8e3cf;--ty:#f8e7b0;--tr:#f6d9d3;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--chalk);font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-size:14px;
 background-color:#245039;
 background-image:radial-gradient(ellipse at 15% 8%,rgba(255,255,255,.09),transparent 45%),radial-gradient(ellipse at 85% 65%,rgba(255,255,255,.06),transparent 50%),repeating-linear-gradient(118deg,rgba(255,255,255,.028) 0 2px,transparent 2px 11px),repeating-linear-gradient(32deg,rgba(0,0,0,.05) 0 1px,transparent 1px 17px)}
h1,h2,h3,.cv{font-family:"Caveat Brush","Segoe Print","Comic Sans MS",cursive;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
svg.i{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{flex:1;width:100%;max-width:1340px;margin:0 auto;padding:24px;display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.side{background:var(--board-d);border:2px dashed rgba(244,236,216,.35);border-radius:24px;padding:20px 14px;position:sticky;top:20px;display:flex;flex-direction:column;min-height:calc(100vh - 80px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font:400 32px "Caveat Brush",cursive}
.brand svg{width:34px;height:34px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;font-weight:700;color:#cfd9c3;text-align:left}
.nav button:hover{background:rgba(244,236,216,.1)}
.nav button[aria-current="page"]{background:var(--chalk);color:var(--ink);box-shadow:inset 4px 0 0 var(--yellow)}
.who{margin-top:auto;border-top:1.5px dashed rgba(244,236,216,.3);padding-top:14px;font-size:12px;color:#cfd9c3}
.who b{display:block;color:var(--chalk);font-size:15px;margin:2px 0}
.out{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px 4px;font-weight:700;color:var(--chalk)}
main{min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:26px;padding-bottom:16px;border-bottom:2px dashed rgba(244,236,216,.3)}
.head h1{font-size:46px;line-height:1.05;display:inline;background:linear-gradient(transparent 78%,var(--yellow) 78%,var(--yellow) 90%,transparent 90%)}
.head p{margin:10px 0 0;opacity:.88;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:800;background:var(--chalk);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.red{background:var(--red);color:var(--chalk)}
.btn.sm{padding:8px 15px;font-size:13px}
.btn:active{transform:translateY(2px);box-shadow:none}
.ghost{border:2px solid var(--yellow);color:var(--yellow);border-radius:999px;padding:7px 16px;font-weight:700;font-size:13px}
.ghost:hover{background:var(--yellow);color:var(--ink)}
.card{background:var(--card);color:var(--ink);border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.view{display:none}.view.on{display:block}
.sub{color:var(--mute);font-size:13px}
/* ringkasan */
.rg{display:grid;grid-template-columns:1fr 290px;gap:22px}
.col{min-width:0;display:flex;flex-direction:column;gap:22px}
.grid{display:grid;grid-template-columns:1.9fr 1fr;gap:20px}
.over{background:var(--board-d);border:2px dashed rgba(244,236,216,.4);border-radius:26px;padding:18px 20px 0;overflow:hidden;display:flex;flex-direction:column}
.over .hd{display:flex;justify-content:space-between;align-items:center}
.over h2{font-size:26px}
.sel{background:rgba(244,236,216,.16);border-radius:10px;padding:4px 11px;font-size:12px;font-weight:700}
.chart{position:relative;margin-top:6px}.chart svg{width:100%;height:130px;display:block}
.tip{position:absolute;top:2px;background:var(--chalk);color:var(--ink);border-radius:9px;padding:4px 10px;font-size:11px;line-height:1.25;transform:translateX(-50%);white-space:nowrap;font-weight:700}
.tip b{display:block;font-size:15px}
.months{display:flex;justify-content:space-between;font-size:11px;opacity:.85;padding:6px 0 14px}
.months .cur{opacity:1;font-weight:800;background:rgba(244,236,216,.22);border-radius:8px;padding:0 6px}
.stats{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:6px;align-items:end;margin:0 -20px;padding:0 20px;background:rgba(0,0,0,.22);flex:1;min-height:104px}
.stats div{padding:14px 0;text-align:center}
.stats small{display:block;font-size:11px;opacity:.85}
.stats b{display:block;font:400 30px/1.1 "Caveat Brush",cursive}
.stats .mid{background:rgba(244,236,216,.12);border-radius:18px;margin-top:-26px;padding-top:20px}
.stats .mid b{font-size:36px;color:var(--yellow)}
.right{display:flex;flex-direction:column;gap:20px}
.big{border-radius:24px;padding:18px;color:var(--chalk);display:flex;gap:12px;position:relative;text-align:left;width:100%;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.big.p{background:var(--hero);border:2px dashed rgba(244,236,216,.4);align-items:center;min-height:96px;padding-right:52px}
.big.k{background:linear-gradient(160deg,var(--red),var(--red2));flex:1;flex-direction:column;justify-content:space-between}
.ico{width:50px;height:50px;border-radius:15px;background:rgba(244,236,216,.2);display:grid;place-items:center;flex:none}
.big h3{font-size:24px;line-height:1.1}.big p{margin:4px 0 0;font-size:12px;opacity:.9}
.go{position:absolute;right:16px;bottom:16px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--chalk);display:grid;place-items:center}
.big.p .go{bottom:auto;top:50%;transform:translateY(-50%)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding-top:22px}
.pc{padding:36px 16px 14px;position:relative;text-align:center}
.pc .badge{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:50px;height:50px;border-radius:15px;background:var(--board);color:var(--chalk);display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.pc h4{margin:0;font:400 22px/1.15 "Caveat Brush",cursive}
.prow{display:flex;justify-content:space-between;font-size:11px;margin:12px 0 4px;color:var(--mute)}.prow b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--yellow)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--mute)}
.chip{background:var(--tr);color:var(--red);border-radius:10px;padding:4px 10px;font-size:11px;font-weight:800}
.panel{padding:18px;display:flex;flex-direction:column;gap:14px;align-self:start}
.sec{display:flex;justify-content:space-between;align-items:center;font:400 22px "Caveat Brush",cursive}
.sec a{color:var(--red);font:700 12px "Nunito",sans-serif;cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--tg);border-radius:14px;padding:4px}
.tabs button{padding:7px;border-radius:11px;font-size:12px;font-weight:700;color:var(--mute)}
.tabs button.on{background:var(--board);color:var(--chalk)}
.fl{display:flex;flex-direction:column;gap:14px}
.fr{display:flex;align-items:center;gap:10px}
.fr .t{flex:1;min-width:0}.fr b{display:block;font-size:13px;line-height:1.25}.fr small{display:block;color:var(--mute);font-size:11px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ty);font-size:16px}
.av.b{background:var(--board);color:var(--chalk)}.av.r{background:var(--tr)}
.msg{width:26px;height:26px;border:1.5px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--board);flex:none}
.msg svg{width:14px;height:14px}
.board{border-radius:14px;height:112px;background:var(--hero) center/cover;border:5px solid var(--wood);position:relative;display:grid;place-items:center;text-align:center;color:var(--chalk);overflow:hidden}
.board svg{position:absolute;inset:0;width:100%;height:100%}.board span{position:relative;font:400 18px "Caveat Brush",cursive;text-shadow:0 1px 3px #000}
/* template */
.bar2{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.seg{display:inline-flex;background:var(--board-d);border:2px dashed rgba(244,236,216,.35);border-radius:16px;padding:4px}
.seg button{padding:9px 18px;border-radius:12px;font-weight:700;color:#cfd9c3}
.seg button.on{background:var(--chalk);color:var(--ink)}
.srch{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--card);color:var(--mute);border-radius:14px;min-width:240px}
.srch input{border:0;background:none;padding:11px 0;width:100%;color:var(--ink);font:inherit}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.tc{padding:24px 26px 20px;display:flex;flex-direction:column;gap:6px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.t-r{background:var(--tr);color:var(--red)}.t-y{background:var(--ty);color:#8a6a00}.t-g{background:var(--tg);color:var(--board)}
.tc h3{font-size:26px;line-height:1.1}
.act{display:flex;justify-content:space-between;align-items:center;border-top:2px dashed var(--line);margin-top:10px;padding-top:14px}
.ia{display:flex;gap:4px}.ia button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.ia button:hover{background:var(--tg)}.ia .del{color:var(--red)}
.empty{padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty h3{font-size:30px}.empty p{max-width:420px;margin:0 0 10px;color:var(--mute)}
.empty .ico{background:var(--tg);color:var(--board);width:64px;height:64px;border-radius:18px}
/* riwayat */
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 26px;border-bottom:2px dashed var(--line)}
.row:last-child{border:0}.row h3{font-size:26px;margin:2px 0 4px}
.row .m{font-size:12px;color:var(--mute);font-weight:800}
.row .ghost{border-color:var(--red);color:var(--red)}.row .ghost:hover{background:var(--red);color:var(--chalk)}
/* papan */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.bcard{overflow:hidden}.bcard .pv{height:120px;background:var(--hero) center/cover;border-bottom:6px solid var(--wood);display:grid;place-items:center;color:var(--chalk);font:400 20px "Caveat Brush",cursive}
.bcard .bt{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bcard b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:16px}
.tools input[type=text]{border:2px solid var(--line);background:#fff8;border-radius:10px;padding:7px 10px;font:inherit;color:var(--ink);width:190px}
.tb{display:flex;gap:4px;background:var(--tg);border-radius:12px;padding:3px}
.tb button{padding:6px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mute)}
.tb button.on{background:var(--board);color:var(--chalk)}
.cols{display:flex;gap:6px}.cols button{width:26px;height:26px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.cols button.on{box-shadow:0 0 0 3px var(--ink)}
.tools label{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.tools .tx{border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;font-size:13px}
#cv{width:100%;height:auto;display:block;border:10px solid var(--wood);border-radius:16px;touch-action:none;cursor:crosshair;box-shadow:0 6px 0 var(--wood-d),0 12px 24px rgba(0,0,0,.3);background:#1f4a37}
/* misc */
dialog{border:0;border-radius:22px;background:var(--card);color:var(--ink);padding:24px 26px;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(10,30,20,.65)}
dialog h3{font-size:30px;margin-bottom:8px}dialog p{margin:6px 0}
dialog label{display:block;font-weight:700;font-size:13px;margin-top:12px}
dialog input,dialog select{display:block;width:100%;margin-top:4px;padding:9px 12px;border:2px solid var(--line);border-radius:10px;font:inherit;background:#fff8;color:var(--ink)}
dialog .btn{margin-top:18px}.dr{display:flex;gap:10px;flex-wrap:wrap}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.sc div{background:var(--cream);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.sc b{font:400 46px/1 "Caveat Brush",cursive}
.rope{height:12px;border-radius:12px;background:var(--line);position:relative;margin:16px 6px 8px}
.rope::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;border-left:2px dashed var(--mute)}
.rope i{position:absolute;top:-5px;width:22px;height:22px;border-radius:50%;background:var(--red);border:3px solid var(--card);transform:translateX(-50%);transition:left .25s}
.rl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
.ledge{height:78px;margin-top:20px;position:relative}
.ledge svg{width:100%;height:100%;display:block}
.chalks{position:absolute;left:10px;bottom:30px;display:flex;flex-direction:column;gap:3px}
.chalks i{display:block;height:12px;background:#7a9c85;border-radius:3px;box-shadow:inset 0 -2px rgba(0,0,0,.15)}
@media (max-width:1080px){.rg{grid-template-columns:1fr}.panel{order:2}}
@media (max-width:860px){.grid,.cards,.tg{grid-template-columns:1fr}.stats b{font-size:24px}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;padding:14px;gap:16px}
  .side{position:static;min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}
  .brand{padding:0}.who{display:none}.nav{flex-direction:row;overflow-x:auto;width:100%}.nav button{white-space:nowrap;padding:9px 12px}
  .head h1{font-size:36px}.row{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo" viewBox="0 0 24 24"><path d="M2 5c3-1 6-1 10 1 4-2 7-2 10-1v14c-3-1-6-1-10 1-4-2-7-2-10-1z"/><path d="M12 6v14"/></symbol>
  <symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.4M3 4v4h4M12 7v5l3 2"/></symbol>
  <symbol id="pen" viewBox="0 0 24 24"><path d="M12 18l7-7-4-8-7 3-3 8 5 5z" transform="translate(0 -1)"/><path d="M5 18l6-6"/><circle cx="12" cy="11" r="1.5"/></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="out" viewBox="0 0 24 24"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></symbol>
  <symbol id="cup" viewBox="0 0 24 24"><path d="M8 4h8v6a4 4 0 01-8 0zM8 6H4v1a4 4 0 004 4M16 6h4v1a4 4 0 01-4 4M12 14v4M8 20h8"/></symbol>
  <symbol id="rope" viewBox="0 0 24 24"><path d="M2 12c3-4 5 4 8 0s5 4 8 0 3 0 4-1M6 7v10M18 7v10"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></symbol>
  <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></symbol>
  <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
</svg>

<div class="shell">
  <aside class="side">
    <div class="brand"><svg class="i" style="stroke-width:1.6"><use href="#logo"/></svg>Discere</div>
    <nav class="nav" aria-label="Menu utama">
      <button data-v="ringkasan"><svg class="i"><use href="#grid"/></svg>Ringkasan</button>
      <button data-v="template"><svg class="i"><use href="#logo"/></svg>Template Game</button>
      <button data-v="riwayat"><svg class="i"><use href="#hist"/></svg>Riwayat Sesi</button>
      <button data-v="papan"><svg class="i"><use href="#pen"/></svg>Papan Tulis</button>
    </nav>
    <div class="who">Masuk sebagai:<b>Guru Demo</b>SD Negeri Merdeka 01
      <button class="out" id="logout"><svg class="i"><use href="#out"/></svg>Keluar</button></div>
  </aside>

  <main>
    <header class="head"><div><h1 id="ttl"></h1><p>Selamat mengajar, Bapak/Ibu Guru Demo.</p></div><button class="btn red" id="hbtn" hidden></button></header>

    <!-- RINGKASAN -->
    <section class="view" id="v-ringkasan"><div class="rg">
      <div class="col">
        <div class="grid">
          <article class="over">
            <div class="hd"><h2>Sesi Game Selesai</h2><button class="sel" id="range">Bulanan ▾</button></div>
            <div class="chart"><div class="tip" id="tip"></div>
              <svg viewBox="0 0 400 130" preserveAspectRatio="none" role="img" aria-label="Grafik sesi game selesai">
                <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4ecd8" stop-opacity=".3"/><stop offset="1" stop-color="#f4ecd8" stop-opacity="0"/></linearGradient></defs>
                <path id="area" fill="url(#g)"/><line id="band" y1="0" y2="130" stroke="#f4ecd8" stroke-opacity=".25" stroke-width="14"/>
                <path id="line" fill="none" stroke="#f2c230" stroke-width="2.5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
                <circle id="dot" r="6" fill="#f2c230" stroke="#f4ecd8" stroke-width="2"/>
              </svg></div>
            <div class="months" id="months"></div>
            <div class="stats"><div><small>Template tersedia</small><b id="s1"></b><small>Template</small></div>
              <div class="mid"><small>Sesi game selesai</small><b id="s2"></b><small>Total sesi</small></div>
              <div><small>Papan tersimpan</small><b id="s3"></b><small>Papan</small></div></div>
          </article>
          <div class="right">
            <button class="big p" data-go="papan"><div class="ico"><svg class="i"><use href="#pen"/></svg></div><div><h3>Buka Papan Tulis Digital</h3><p>Kanvas tak terbatas untuk menjelaskan materi.</p></div><span class="go"><svg class="i" style="width:14px;height:14px"><use href="#arrow"/></svg></span></button>
            <button class="big k" id="btn-new"><div class="ico"><svg class="i"><use href="#plus"/></svg></div><div><h3>Buat Template Kuis Baru</h3><p>Susun soal materi untuk dimainkan bersama kelas.</p></div><span class="go"><svg class="i" style="width:14px;height:14px"><use href="#arrow"/></svg></span></button>
          </div>
        </div>
        <div class="sec" style="margin:4px 0 -6px">Template Game Terbaru <a data-go="template" style="color:var(--yellow)">Lihat Semua</a></div>
        <div class="cards" id="latest"></div>
      </div>
      <aside class="card panel">
        <div class="sec">Riwayat Sesi <a data-go="riwayat">Lihat semua</a></div>
        <div class="tabs"><button class="on" data-tab="hist">Riwayat</button><button data-tab="tpl">Template</button></div>
        <div class="fl" id="fl"></div>
        <div class="sec" style="margin-top:4px">Papan Tulis <a data-go="papan">Lihat</a></div>
        <div class="board" id="bprev"></div>
        <button class="btn red sm" id="pnew" style="justify-content:center"><svg class="i" style="width:14px;height:14px"><use href="#plus"/></svg>Buat Papan Baru</button>
      </aside>
    </div></section>

    <!-- TEMPLATE -->
    <section class="view" id="v-template">
      <div class="bar2"><div class="seg"><button class="on" data-src="mine" id="tmine"></button><button data-src="official" id="toff"></button></div>
        <label class="srch"><svg class="i"><use href="#search"/></svg><input type="search" id="q" placeholder="Cari materi..." aria-label="Cari materi"></label></div>
      <div class="tg" id="tpl"></div>
    </section>

    <!-- RIWAYAT -->
    <section class="view" id="v-riwayat"><div class="card" id="hist"></div></section>

    <!-- PAPAN -->
    <section class="view" id="v-papan">
      <div id="pl"></div>
      <div id="ed" hidden>
        <div class="card tools">
          <input type="text" id="bn" aria-label="Nama papan" maxlength="40">
          <div class="tb" id="tb"><button class="on" data-tool="pen">Pena</button><button data-tool="eraser">Penghapus</button><button data-tool="line">Garis</button><button data-tool="rect">Kotak</button><button data-tool="circle">Bulat</button></div>
          <div class="cols" id="cols"></div>
          <label>Tebal <input type="range" id="sz" min="2" max="16" value="4"></label>
          <button class="tx" data-act="undo">Urungkan</button><button class="tx" data-act="clear">Bersihkan</button>
          <button class="btn red sm" data-act="save">Simpan</button><button class="tx" data-act="close">Tutup</button>
        </div>
        <canvas id="cv" width="1000" height="560" aria-label="Kanvas papan tulis"></canvas>
      </div>
    </section>
  </main>
</div>

<div class="ledge"><svg viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 34C240 6 480 62 720 34S1200 6 1440 34V80H0z" fill="#a6783c"/><path d="M0 56C260 34 520 80 760 56S1220 36 1440 58V80H0z" fill="#8d6444"/></svg><div class="chalks"><i style="width:84px"></i><i style="width:70px"></i><i style="width:92px"></i></div></div>
<dialog id="dlg"><h3 id="dt"></h3><div id="db"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const MON=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const p2=n=>String(n).padStart(2,"0");
const fmt=d=>`${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${p2(d.getHours())}.${p2(d.getMinutes())}`;
const ic=n=>`<svg class="i"><use href="#${n}"/></svg>`;
let uid=200;
let TPL=[
 {id:1,t:"Matematika Dasar: Operasi Hitung Campuran (Salinan)",n:5,m:"Solo"},
 {id:2,t:"Cara Membuat Sejarah Baru",n:15,m:"Multiplayer"},
 {id:3,t:"Sejarah Proklamasi",n:4,m:"Multiplayer"},
 {id:4,t:"Pecahan Kelas 5",n:6,m:"Solo"}];
const OFF=[
 {id:101,t:"Perkalian dan Pembagian Dasar",n:10,m:"Solo"},
 {id:102,t:"Keragaman Budaya Indonesia",n:12,m:"Multiplayer"},
 {id:103,t:"Siklus Air dan Cuaca",n:8,m:"Solo"}];
let SES=[
 {t:"Cara Membuat Sejarah Baru",ts:new Date(2026,10,9,10,44),mode:"multi",a:0,b:0},
 {t:"Pecahan Kelas 5",ts:new Date(2026,10,9,10,15),mode:"multi",a:0,b:0},
 {t:"Pecahan Kelas 5",ts:new Date(2026,10,9,10,14),mode:"multi",a:0,b:0},
 {t:"Sejarah Proklamasi",ts:new Date(2026,10,9,10,0),mode:"multi",a:1,b:0}];
let boards=[{id:1,name:"Papan tanpa judul 1",img:null}];
let view="ringkasan",src="mine",tab="hist",mode="Bulanan";

const res=s=>s.mode==="solo"?{em:"🏅",n:"SELESAI",line:`Skor: ${s.a}`,pos:null}:
  {em:s.a>s.b?"🔴":s.b>s.a?"⚪":"🤝",n:s.a>s.b?"TIM MERAH":s.b>s.a?"TIM PUTIH":"SERI",line:`Skor: ${s.a} vs ${s.b}`,pos:s.b-s.a};
const ropeHTML=pos=>{const c=Math.max(-5,Math.min(5,pos));return `<div class="rope"><i style="left:${50+c*8}%"></i></div><div class="rl"><span>Tim Merah</span><span>Tim Putih</span></div>`};

/* dialog & toast */
const dlg=$("dlg");let tt;
function openDlg(t,h,mount){$("dt").textContent=t;$("db").innerHTML=h;dlg.showModal();mount&&mount()}
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)}
const closeBtn=`<button class="btn sm" data-close>Tutup</button>`;

/* render */
function chart(){
  const last=SES[0].ts,W=400;let l,v,cur;
  if(mode==="Bulanan"){l=MON;v=Array(12).fill(0);SES.forEach(s=>{if(s.ts.getFullYear()===last.getFullYear())v[s.ts.getMonth()]++});cur=last.getMonth()}
  else{l=["Sen","Sel","Rab","Kam","Jum","Sab","Min"];v=Array(7).fill(0);const mon=new Date(last);mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
    SES.forEach(s=>{const d=Math.floor((s.ts-mon)/864e5);if(d>=0&&d<7)v[d]++});cur=(last.getDay()+6)%7}
  const mx=Math.max(4,...v),n=v.length,pts=v.map((x,i)=>[i*W/(n-1),108-x/mx*80]);
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<n;i++){const [a,b]=pts[i-1],[c,e]=pts[i],m=(a+c)/2;d+=` C${m} ${b} ${m} ${e} ${c} ${e}`}
  $("line").setAttribute("d",d);$("area").setAttribute("d",d+" V130 H0z");
  const [cx,cy]=pts[cur];
  $("band").setAttribute("x1",cx);$("band").setAttribute("x2",cx);$("dot").setAttribute("cx",cx);$("dot").setAttribute("cy",cy);
  const tip=$("tip");tip.innerHTML=`<b>${v[cur]}</b>Sesi`;tip.style.left=Math.min(Math.max(cx/W*100,8),92)+"%";
  $("months").innerHTML=l.map((m,i)=>`<span class="${i===cur?"cur":""}">${m}</span>`).join("");
}
const plays=t=>SES.filter(s=>s.t===t).length;
function latest(){
  const rows=[...TPL].map(x=>({...x,p:plays(x.t)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p).slice(0,3);
  $("latest").innerHTML=rows.length?rows.map(x=>`<article class="card pc"><div class="badge">${ic(x.m==="Solo"?"logo":"rope")}</div>
  <h4>${x.t}</h4><div class="sub">${x.n} Soal Tersedia • Tarik Tambang</div>
  <div class="prow"><span>Porsi sesi</span><b>${Math.round(x.p/SES.length*100)}%</b></div><div class="bar"><i style="width:${x.p/SES.length*100}%"></i></div>
  <div class="foot"><span>${x.p} dari ${SES.length} sesi</span><button class="chip" data-play="${x.id}">${x.m==="Solo"?"Mulai Game Solo":"Mulai Lomba"}</button></div></article>`).join(""):
  `<div class="card empty" style="grid-column:1/-1"><p>Belum ada sesi. Mulai game dari menu Template Game.</p></div>`;
}
function fl(){
  $("fl").innerHTML=tab==="hist"?SES.slice(0,4).map((s,i)=>{const r=res(s);return `<div class="fr"><div class="av ${r.em==="🔴"?"r":""}">${r.em}</div><div class="t"><b>${s.t}</b><small>Pemenang: ${r.n}</small><small>${fmt(s.ts)}</small></div><button class="msg" aria-label="Lihat detail" data-detail="${i}">${ic("arrow")}</button></div>`}).join(""):
  TPL.map(x=>`<div class="fr"><div class="av b">${ic(x.m==="Solo"?"logo":"rope")}</div><div class="t"><b>${x.t}</b><small>${x.n} soal • Mode ${x.m}</small></div><button class="msg" aria-label="Mulai" data-play="${x.id}">${ic("arrow")}</button></div>`).join("");
}
function prev(){
  const b=boards[boards.length-1],e=$("bprev");
  e.style.backgroundImage=b&&b.img?`url(${b.img})`:"none";
  e.innerHTML=b?(b.img?"":`<svg viewBox="0 0 240 120" preserveAspectRatio="none" aria-hidden="true"><path d="M20 80c20-30 40 20 60-10s40 10 60-5 40-25 70 0" fill="none" stroke="#f4ecd8" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/><circle cx="190" cy="30" r="12" fill="none" stroke="#f2c230" stroke-width="2.5"/></svg>`)+`<span>${b.name}</span>`:`<span>Belum ada papan</span>`;
}
function tplCard(x,own){
  return `<article class="card tc"><div class="tags"><span class="tag t-r">Tarik Tambang</span><span class="tag ${x.m==="Solo"?"t-g":"t-y"}">Mode ${x.m}</span></div>
  <h3>${x.t}</h3><div class="sub">${x.n} Soal Tersedia</div>
  <div class="act"><button class="btn red sm" data-play="${x.id}">${ic("play")}${x.m==="Solo"?"Mulai Game Solo":"Mulai Lomba"}</button>
  <div class="ia">${own?`<button aria-label="Ubah" data-edit="${x.id}">${ic("edit")}</button>`:""}<button aria-label="Salin" data-copy="${x.id}">${ic("copy")}</button>${own?`<button class="del" aria-label="Hapus" data-del="${x.id}">${ic("trash")}</button>`:""}</div></div></article>`;
}
function tpls(){
  $("tmine").textContent=`Template Saya (${TPL.length})`;$("toff").textContent=`Pustaka Resmi (${OFF.length})`;
  const q=$("q").value.toLowerCase(),data=(src==="mine"?TPL:OFF).filter(x=>x.t.toLowerCase().includes(q));
  $("tpl").innerHTML=data.length?data.map(x=>tplCard(x,src==="mine")).join(""):`<div class="card empty" style="grid-column:1/-1"><p>${q?"Materi tidak ditemukan.":"Belum ada template. Buat yang pertama!"}</p></div>`;
}
function hist(){
  $("hist").innerHTML=SES.length?SES.map((s,i)=>{const r=res(s);return `<div class="row"><div><div class="m">MODE ${s.mode==="solo"?"SOLO":"MULTI"} • ${fmt(s.ts)}</div><h3>${s.t}</h3>
  <div>Pemenang: ${r.em} <b>${r.n}</b> (${r.line})${r.pos===null?"":` • Posisi Tali: <b>${r.pos}</b>`}</div></div><button class="ghost" data-detail="${i}">Lihat Detail</button></div>`}).join(""):
  `<div class="empty"><h3>Belum ada riwayat</h3><p>Mainkan game dari Template Game untuk melihat hasilnya di sini.</p></div>`;
}
function pl(){
  $("pl").innerHTML=boards.length?`<div class="boards">${boards.map(b=>`<article class="card bcard"><div class="pv" style="${b.img?`background-image:url(${b.img})`:""}">${b.img?"":"kanvas kosong"}</div><div class="bt"><b>${b.name}</b><div class="ia"><button class="btn sm red" data-open="${b.id}">Buka</button><button class="del" aria-label="Hapus papan" data-delb="${b.id}">${ic("trash")}</button></div></div></article>`).join("")}</div>`:
  `<div class="card empty"><div class="ico">${ic("pen")}</div><h3>Belum Ada Papan Tulis Tersimpan</h3><p>Mulai jelaskan materi pelajaran dengan kanvas menggunakan pena, bentuk, dan penghapus.</p><button class="btn red" data-newb>${ic("plus")}Buka Papan Pertama Anda</button></div>`;
}
function stats(){$("s1").textContent=TPL.length;$("s2").textContent=SES.length;$("s3").textContent=boards.length}
function all(){stats();chart();latest();fl();prev();tpls();hist();pl()}

/* navigasi */
const V={ringkasan:{t:"Ringkasan Aktivitas"},template:{t:"Manajemen Template Game",b:"Buat Template Baru"},riwayat:{t:"Riwayat Pertandingan"},papan:{t:"Papan Tulis Interaktif",b:"Buat Papan Baru"}};
function go(v){
  if(!V[v])v="ringkasan";view=v;
  document.querySelectorAll(".view").forEach(e=>e.classList.toggle("on",e.id==="v-"+v));
  document.querySelectorAll(".nav button").forEach(b=>b.dataset.v===v?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  $("ttl").textContent=V[v].t;const hb=$("hbtn");hb.hidden=!V[v].b;hb.innerHTML=V[v].b?ic("plus")+V[v].b:"";
  if(v!=="papan")closeEd();
  if(location.hash!=="#"+v)history.replaceState(null,"","#"+v);
  window.scrollTo(0,0);
}

/* template CRUD & game */
function tplForm(x){
  openDlg(x?"Ubah Template":"Template Baru",`<label>Judul materi<input id="f-t" maxlength="70" value="${x?x.t.replace(/"/g,"&quot;"):""}"></label>
  <label>Mode<select id="f-m"><option ${x&&x.m==="Solo"?"selected":""}>Solo</option><option ${x&&x.m==="Multiplayer"?"selected":""}>Multiplayer</option></select></label>
  <label>Jumlah soal<input id="f-n" type="number" min="1" max="50" value="${x?x.n:5}"></label>
  <div class="dr"><button class="btn red" id="f-ok">Simpan</button><button class="btn" data-close>Batal</button></div>`,()=>{
    $("f-ok").onclick=()=>{const t=$("f-t").value.trim();if(!t){$("f-t").focus();return}
      const n=Math.max(1,Math.min(50,+$("f-n").value||1)),m=$("f-m").value;
      if(x){Object.assign(x,{t,n,m})}else TPL.unshift({id:++uid,t,n,m});
      dlg.close();src="mine";document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b.dataset.src==="mine"));all();toast(x?"Template diperbarui":"Template dibuat");if(!x)go("template")}});
}
function play(x){
  let a=0,b=0;const solo=x.m==="Solo";
  const draw=()=>{$("sa").textContent=a;if(!solo){$("sb").textContent=b;$("rp").innerHTML=ropeHTML(b-a)}};
  openDlg(x.t,`<p class="sub">Mode ${x.m} • ${x.n} soal</p>
  <div class="sc">${solo?`<div style="grid-column:1/-1"><span>Skor</span><b id="sa">0</b><button class="btn sm red" data-pt="a">+1 Benar</button></div>`:
  `<div><span>🔴 Tim Merah</span><b id="sa">0</b><button class="btn sm red" data-pt="a">+1 Poin</button></div><div><span>⚪ Tim Putih</span><b id="sb">0</b><button class="btn sm" data-pt="b" style="background:#fff">+1 Poin</button></div>`}</div>
  <div id="rp"></div><div class="dr"><button class="btn red" id="fin">Selesai &amp; Simpan</button><button class="btn" data-close>Batal</button></div>`,()=>{
    draw();
    $("db").onclick=e=>{const k=e.target.closest("[data-pt]");if(k){k.dataset.pt==="a"?a++:b++;draw()}};
    $("fin").onclick=()=>{SES.unshift({t:x.t,ts:new Date(),mode:solo?"solo":"multi",a,b});dlg.close();all();toast("Sesi disimpan ke Riwayat")}});
}
function detail(s){
  const r=res(s);
  openDlg(s.t,`<p class="sub">Mode ${s.mode==="solo"?"Solo":"Multi"} • ${fmt(s.ts)}</p><p>Pemenang: ${r.em} <b>${r.n}</b></p><p>${r.line}${r.pos===null?"":` • Posisi tali: <b>${r.pos}</b>`}</p>${r.pos===null?"":ropeHTML(r.pos)}${closeBtn}`);
}

/* papan tulis */
const cv=$("cv"),cx=cv.getContext("2d"),BG="#1f4a37",COLS=["#f4ecd8","#f2c230","#ff8a80","#8fd3ff","#a5e5a0"];
let cur=null,tool="pen",col=COLS[0],undo=[],dr=null;
$("cols").innerHTML=COLS.map((c,i)=>`<button data-col="${c}" aria-label="Warna kapur ${i+1}" class="${i?"":"on"}" style="background:${c}"></button>`).join("");
const clearCv=()=>{cx.fillStyle=BG;cx.fillRect(0,0,cv.width,cv.height)};
function openBoard(id){
  cur=boards.find(b=>b.id===id);clearCv();undo=[];
  if(cur.img){const im=new Image();im.onload=()=>cx.drawImage(im,0,0,cv.width,cv.height);im.src=cur.img}
  $("bn").value=cur.name;$("pl").hidden=true;$("ed").hidden=false;$("hbtn").hidden=true;
}
function closeEd(){if(!$("ed").hidden){$("ed").hidden=true;$("pl").hidden=false;cur=null;if(view==="papan")$("hbtn").hidden=false}}
function newBoard(){const b={id:++uid,name:"Papan tanpa judul "+(boards.length+1),img:null};boards.push(b);all();go("papan");openBoard(b.id)}
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);undo.push(cx.getImageData(0,0,cv.width,cv.height));if(undo.length>25)undo.shift();
  const s=pt(e);dr={s,p:s,snap:undo[undo.length-1]};
  if(tool==="pen"||tool==="eraser"){setSt();cx.beginPath();cx.moveTo(s[0],s[1]);cx.lineTo(s[0]+.1,s[1]);cx.stroke()}
});
cv.addEventListener("pointermove",e=>{
  if(!dr)return;const p=pt(e);setSt();
  if(tool==="pen"||tool==="eraser"){cx.beginPath();cx.moveTo(dr.p[0],dr.p[1]);cx.lineTo(p[0],p[1]);cx.stroke()}
  else{cx.putImageData(dr.snap,0,0);const [x,y]=dr.s;cx.beginPath();
    if(tool==="line"){cx.moveTo(x,y);cx.lineTo(p[0],p[1])}
    else if(tool==="rect")cx.rect(x,y,p[0]-x,p[1]-y);
    else cx.ellipse((x+p[0])/2,(y+p[1])/2,Math.abs(p[0]-x)/2,Math.abs(p[1]-y)/2,0,0,7);
    cx.stroke()}
  dr.p=p;
});
const endDr=()=>{dr=null};cv.addEventListener("pointerup",endDr);cv.addEventListener("pointercancel",endDr);
function setSt(){const z=+$("sz").value;cx.lineCap=cx.lineJoin="round";cx.lineWidth=tool==="eraser"?z*4:z;cx.strokeStyle=tool==="eraser"?BG:col}

/* event */
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-v],[data-go]");if(g)return go(g.dataset.v||g.dataset.go);
  if(e.target.closest("[data-close]"))return dlg.close();
  const D=(k)=>e.target.closest(`[data-${k}]`);let el;
  if(el=D("src")){src=el.dataset.src;document.querySelectorAll(".seg button").forEach(b=>b.classList.toggle("on",b===el));return tpls()}
  if(el=D("tab")){tab=el.dataset.tab;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b===el));return fl()}
  if(el=D("play"))return play([...TPL,...OFF].find(x=>x.id==el.dataset.play));
  if(el=D("detail"))return detail(SES[+el.dataset.detail]);
  if(el=D("edit"))return tplForm(TPL.find(x=>x.id==el.dataset.edit));
  if(el=D("copy")){const x=[...TPL,...OFF].find(y=>y.id==el.dataset.copy);TPL.unshift({id:++uid,t:x.t.replace(/ \(Salinan\)$/,"")+" (Salinan)",n:x.n,m:x.m});all();return toast("Template disalin ke Template Saya")}
  if(el=D("del")){const x=TPL.find(y=>y.id==el.dataset.del);return openDlg("Hapus template?",`<p>“${x.t}” akan dihapus dari Template Saya.</p><div class="dr"><button class="btn red" id="ok">Hapus</button><button class="btn" data-close>Batal</button></div>`,()=>{$("ok").onclick=()=>{TPL=TPL.filter(y=>y!==x);dlg.close();all();toast("Template dihapus")}})}
  if(el=D("open"))return openBoard(+el.dataset.open);
  if(el=D("delb")){const b=boards.find(y=>y.id==el.dataset.delb);return openDlg("Hapus papan?",`<p>“${b.name}” akan dihapus.</p><div class="dr"><button class="btn red" id="ok">Hapus</button><button class="btn" data-close>Batal</button></div>`,()=>{$("ok").onclick=()=>{boards=boards.filter(y=>y!==b);dlg.close();all();toast("Papan dihapus")}})}
  if(D("newb"))return newBoard();
  if(el=D("tool")){tool=el.dataset.tool;return document.querySelectorAll("#tb button").forEach(b=>b.classList.toggle("on",b===el))}
  if(el=D("col")){col=el.dataset.col;if(tool==="eraser"){tool="pen";document.querySelectorAll("#tb button").forEach(b=>b.classList.toggle("on",b.dataset.tool==="pen"))}return document.querySelectorAll("#cols button").forEach(b=>b.classList.toggle("on",b===el))}
  if(el=D("act")){const a=el.dataset.act;
    if(a==="undo"){const s=undo.pop();s?cx.putImageData(s,0,0):toast("Tidak ada yang diurungkan")}
    if(a==="clear"){undo.push(cx.getImageData(0,0,cv.width,cv.height));clearCv()}
    if(a==="save"&&cur){cur.name=$("bn").value.trim()||cur.name;cur.img=cv.toDataURL("image/png");all();toast("Papan disimpan")}
    if(a==="close"){closeEd();all()}}
});
$("hbtn").onclick=()=>view==="papan"?newBoard():tplForm();
$("btn-new").onclick=()=>tplForm();
$("pnew").onclick=()=>newBoard();
$("range").onclick=e=>{mode=mode==="Bulanan"?"Mingguan":"Bulanan";e.currentTarget.textContent=mode+" ▾";chart()};
$("q").addEventListener("input",tpls);
$("logout").onclick=()=>openDlg("Keluar dari Portal Guru?",`<p>Ini hanya tampilan contoh, jadi tidak ada sesi yang benar-benar berakhir.</p><div class="dr"><button class="btn red" data-close>Tetap di sini</button></div>`);
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
all();go(location.hash.slice(1));
</script>
</body>
</html>
